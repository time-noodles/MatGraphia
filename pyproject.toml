[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matgraphia"
version = "0.1.0"
description = "固体化学・材料科学研究室向けの実験管理システム"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "time-noodles" }
]
dependencies = [
    "streamlit>=1.20.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "pdfplumber>=0.11.0",
    "numpy>=1.24,<2.0.0",
    "scipy>=1.14.1; python_version >= '3.12'",
    "scipy>=1.10,<1.14.0; python_version < '3.12'",
    "pymatgen>=2026.2.24; python_version >= '3.12'",
    "pymatgen==2024.8.9; python_version < '3.12'",
    "scikit-learn>=1.4.0",
    "ase>=3.23.0",
    "crystal-toolkit>=2024.1.0",
    "chempy>=0.9.0",
    "py3Dmol>=2.4.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
